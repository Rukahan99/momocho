<style>

/* Layout: Keep式のカード敷き詰め。上に検索と目印の帯、カードはタップで開いてすぐ直す */
:root{
  --bg:#f6f4f7; --surface:#ffffff; --fg:#2b2530; --muted:#7a7080; --line:#e3dde6;
  --accent:#6b3a63; --accent-soft:#efe4ed; --on-accent:#fff;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --accent:#d6a8cd; --accent-soft:#3b2b39; --on-accent:#241b23;
  --c-grape:#3d2a3a; --c-yellow:#45401f; --c-beige:#3d362b; --c-leaf:#2e3a26; --c-sky:#243442; --c-rose:#442a2c;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1820; --surface:#262129; --fg:#ece6ef; --muted:#a397a9; --line:#3a333f;
  --accent:#d6a8cd; --accent-soft:#3b2b39; --on-accent:#241b23;
  --c-grape:#3d2a3a; --c-yellow:#45401f; --c-beige:#3d362b; --c-leaf:#2e3a26; --c-sky:#243442; --c-rose:#442a2c;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:flex;flex-direction:column;gap:10px}

.c-grape{background:var(--c-grape)}.c-yellow{background:var(--c-yellow)}.c-beige{background:var(--c-beige)}

main{padding-block:0 110px}

.ordbtn{flex:none;font-size:13px;color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:4px 10px}

.dr-top{display:flex;align-items:center;gap:8px;padding:12px 12px 8px}

.lbl-row input.nm:focus{border-color:var(--accent);background:var(--bg);outline:none}

async function exportAll(){

    labels:labels.map(l=>({...l})), prefs:JSON.parse(JSON.stringify(prefs))};
  const json=JSON.stringify(data,null,1), name="momocho-"+stamp()+".json";
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));a.download=name;document.body.append(a);a.click();a.remove();toast("書き出しました（メモ"+data.notes.length+"件）")}
  catch(e){toast("この画面では書き出せませんでした")}

async function importText(text){
  let d; try{d=JSON.parse(text)}catch(e){toast("読み込めませんでした。もも帳で書き出したファイルを選んでください");return}
  if(!d||d.app!=="momocho"||!Array.isArray(d.notes)){toast("もも帳で書き出したファイルではないようです");return}
  let added=0,updated=0; const touched=[];
  d.notes.forEach(x=>{if(!x||!x.id||typeof x.text!=="string")return; const cur=notes.get(x.id);
    if(!cur){notes.set(x.id,{...x});added++;touched.push(x.id)}
    else if((x.updated||0)>(cur.updated||0)){notes.set(x.id,{...cur,...x});updated++;touched.push(x.id)}});
  let lch=false; (d.labels||[]).forEach(l=>{if(l&&l.id&&!lab(l.id)){labels.push({id:l.id,name:String(l.name||"ラベル"),parent:l.parent||null});lch=true}});
  if(lch) saveLabels();
  if(d.prefs){prefs.sort=prefs.sort||{};prefs.order=prefs.order||{};let pch=false;
    Object.entries(d.prefs.sort||{}).forEach(([k,v])=>{if(!prefs.sort[k]){prefs.sort[k]=v;pch=true}});
    Object.entries(d.prefs.order||{}).forEach(([k,v])=>{if(!prefs.order[k]&&Array.isArray(v)){prefs.order[k]=v;pch=true}});
    if(pch) savePrefs()}
  render();
  toast("読み込んでいます…");
  if(mode==="db"){for(const id of touched){await persist(id)}} else lsSave();
  render();
  toast("読み込みました：新しいメモ"+added+"件、新しい版に更新"+updated+"件");
}

function openReader(){
  rd.items=bookSrc.slice(); if(!rd.items.length)return;
  rd.key="momocho-read-"+sortKey()+(view.q.trim()?"-q":"");
  $("rdTitle").textContent=bookName();
  rdHistReset(); rd.edit=false; $("rdEdit").setAttribute("aria-pressed","false"); $("rdEdit").textContent="直す"; $("rdNote").hidden=true; $("rdBook").classList.remove("editing");
  buildBook(); applyReaderLook(); $("reader").hidden=false; $("rdScroll").scrollTop=0; $("rdScroll").scrollLeft=0;
  let last=null;try{last=localStorage.getItem(rd.key)}catch(e){}
  const n=last&&rd.items.find(x=>x.id===last);
  if(n&&rd.items[0].id!==last) setTimeout(()=>toast("前回は「"+tocName(n)+"」まで",["続きから",()=>jumpTo(last)]),250);
}
function buildBook(){
  const book=$("rdBook"); book.innerHTML="";
  book.append(el("h1",null,bookName()));
  book.append(el("p","sub","全"+rd.items.length+"編"));
  const toc=el("ol","toc");
  rd.items.forEach((n,i)=>{const li=el("li");const b=el("button");b.append(el("span","no",String(i+1)),document.createTextNode(tocName(n)));b.onclick=()=>jumpTo(n.id);li.append(b);toc.append(li)});
  book.append(toc);
  rd.items.forEach(n=>book.append(chapter(n)));
  if(rd.obs)rd.obs.disconnect();
  rd.obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){rd.cur=e.target.dataset.id;try{localStorage.setItem(rd.key,rd.cur)}catch(_){}}})},{root:$("rdScroll"),rootMargin:rd.vertical?"0px 0px 0px -70%":"0px 0px -70% 0px"});
  book.querySelectorAll(".ch").forEach(c=>rd.obs.observe(c));
}
function chapter(n){
  const sec=el("section","ch");sec.id="ch-"+n.id;sec.dataset.id=n.id;
  const h=el("div","ch-head"); const t=headOf(n);
  let h2=null;
  if(t){h2=el("h2",null,t);h.append(h2)} else h.append(el("span","date",fmt(n.created||n.updated)));
  const body=el("div","ch-body",bodyOf(n));
  sec.append(h,body);
  const save=()=>{
    const m=notes.get(n.id); if(!m)return;
    const old=m.text||"", oldBody=bodyOf(m), oldTitle=headOf(m);
    let head=old.slice(0,old.length-oldBody.length);
    if(h2&&oldTitle){const nt=h2.innerText.replace(/\n/g,"").trim()||oldTitle;head=head.replace(oldTitle,nt)}
    const nb=body.innerText.replace(/\u00a0/g," ");
    const nx=head+nb; if(nx===old)return;
    rdHistPush(n.id,old,nx);
    m.text=nx; m.updated=Date.now();
    clearTimeout(rd.timers[n.id]); rd.timers[n.id]=setTimeout(()=>{delete rd.timers[n.id];persist(n.id)},700);
  };
  [body,h2].forEach(x=>{if(!x)return;x.addEventListener("input",save);x.addEventListener("blur",()=>{if(rd.timers[n.id]){clearTimeout(rd.timers[n.id]);delete rd.timers[n.id];persist(n.id)}})});
  if(h2)h2.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();body.focus()}});
  setEditable(sec,rd.edit);
  return sec;
}
let rdh={stack:[],pos:0,last:0,lastId:null};
function rdHistReset(){rdh={stack:[],pos:0,last:0,lastId:null};rdHistPaint()}
function rdHistPaint(){$("rdUndo").disabled=rdh.pos<=0;$("rdRedo").disabled=rdh.pos>=rdh.stack.length}
function rdHistPush(id,before,after){
  const now=Date.now(), big=Math.abs(after.length-before.length)>15;
  rdh.stack.length=rdh.pos;
  const top=rdh.stack[rdh.pos-1];
  if(top&&!big&&rdh.lastId===id&&now-rdh.last<900) top.after=after;
  else {rdh.stack.push({id,before,after});rdh.pos++;if(rdh.stack.length>300){rdh.stack.shift();rdh.pos--}}
  rdh.last=big?0:now; rdh.lastId=id; rdHistPaint();
}
function rdApply(id,text){
  const m=notes.get(id); if(!m)return;
  clearTimeout(rd.timers[id]); delete rd.timers[id];
  m.text=text; m.updated=Date.now(); persist(id);
  const sc=$("rdScroll"), top=sc.scrollTop, left=sc.scrollLeft;
  const old=$("ch-"+id); if(!old)return;
  const ns=chapter(m); old.replaceWith(ns); rd.obs&&rd.obs.observe(ns);
  sc.scrollTop=top; sc.scrollLeft=left;
  const a=ns.getBoundingClientRect(), b=sc.getBoundingClientRect();
  const seen=a.bottom>b.top&&a.top<b.bottom&&a.right>b.left&&a.left<b.right;
  if(!seen) ns.scrollIntoView({block:"start",inline:"start"});
}
function rdGo(d){
  if(d<0){if(rdh.pos<=0)return;const e=rdh.stack[--rdh.pos];rdApply(e.id,e.before)}
  else {if(rdh.pos>=rdh.stack.length)return;const e=rdh.stack[rdh.pos++];rdApply(e.id,e.after)}
  rdh.last=0; rdHistPaint();
}
$("rdUndo").onclick=()=>rdGo(-1);
$("rdRedo").onclick=()=>rdGo(1);
["rdUndo","rdRedo"].forEach(k=>$(k).addEventListener("mousedown",e=>e.preventDefault()));
$("rdBook").addEventListener("keydown",e=>{
  if(!rd.edit||!(e.ctrlKey||e.metaKey))return; const k=e.key.toLowerCase();
  if(k==="z"&&!e.shiftKey){e.preventDefault();rdGo(-1)}
  else if((k==="z"&&e.shiftKey)||k==="y"){e.preventDefault();rdGo(1)}
});
$("rdBook").addEventListener("beforeinput",e=>{
  if(e.inputType==="historyUndo"){e.preventDefault();rdGo(-1)}
  else if(e.inputType==="historyRedo"){e.preventDefault();rdGo(1)}
});
/* mouse wheel scrolls sideways in vertical mode */
$("rdScroll").addEventListener("wheel",e=>{
  if(!rd.vertical||e.ctrlKey)return;
  if(Math.abs(e.deltaY)<=Math.abs(e.deltaX))return;
  e.preventDefault();
  const unit=e.deltaMode===1?32:e.deltaMode===2?$("rdScroll").clientWidth:1;
  $("rdScroll").scrollLeft-=e.deltaY*unit;
},{passive:false});
function setEditable(sec,on){sec.querySelectorAll(".ch-body,.ch-head h2").forEach(x=>{if(on){x.setAttribute("contenteditable","plaintext-only");x.spellcheck=false}else x.removeAttribute("contenteditable")})}
function setRdEdit(on){
  rd.edit=on; $("rdEdit").setAttribute("aria-pressed",String(on)); $("rdEdit").textContent=on?"読む":"直す";
  $("rdNote").hidden=!on; $("rdBook").classList.toggle("editing",on);
  if(!on){document.activeElement&&document.activeElement.blur&&document.activeElement.blur();Object.keys(rd.timers).forEach(id=>{clearTimeout(rd.timers[id]);persist(id)});rd.timers={}}
  $("rdBook").querySelectorAll(".ch").forEach(c=>setEditable(c,on));
}
function jumpTo(id){$("rdToc").hidden=true;const c=$("ch-"+id);if(c)c.scrollIntoView({block:"start",inline:"start"})}
function applyReaderLook(){
  document.documentElement.style.setProperty("--rd-size",RD_SIZES[rd.size]+"px");
  const sc=$("rdScroll"); sc.classList.toggle("vertical",rd.vertical);
  $("rdDir").textContent=rd.vertical?"横書き":"縦書き";
}
function closeReader(){
  setRdEdit(false);
  $("reader").hidden=true; $("rdToc").hidden=true; if(rd.obs)rd.obs.disconnect();
  document.querySelectorAll(".ch-edit").forEach(t=>t.blur()); render();
}
$("bookBtn").onclick=openReader;
$("rdEdit").onclick=()=>setRdEdit(!rd.edit);
$("rdClose").onclick=closeReader;
$("rdTocBtn").onclick=()=>{const p=$("rdTocPanel");p.innerHTML="";
  const th=el("div","tochead");th.append(el("h3",null,"目次"));
  if(!view.q.trim()){const ob=el("button","mini","順番を並べる");ob.onclick=()=>{$("rdToc").hidden=true;if(ensureManual()){render();toast("自分で並べた順に切り替えました")}openOrder()};th.append(ob)}
  p.append(th);
  rd.items.forEach((n,i)=>{const b=el("button");b.setAttribute("aria-current",String(rd.cur===n.id));b.append(el("span","no",String(i+1)),el("span",null,tocName(n)));b.onclick=()=>jumpTo(n.id);p.append(b)});
  $("rdToc").hidden=false; const c=p.querySelector('[aria-current="true"]'); if(c)c.scrollIntoView({block:"center"})};
$("rdToc").addEventListener("click",e=>{if(e.target===$("rdToc"))$("rdToc").hidden=true});
$("rdDir").onclick=()=>{const keep=rd.cur;rd.vertical=!rd.vertical;rdSavePref();buildBook();applyReaderLook();if(keep)requestAnimationFrame(()=>jumpTo(keep))};
$("rdSmall").onclick=()=>{if(rd.size>0){rd.size--;rdSavePref();applyReaderLook()}};
$("rdBig").onclick=()=>{if(rd.size<RD_SIZES.length-1){rd.size++;rdSavePref();applyReaderLook()}};

const THEMES=[["","自動"],["light","明るい"],["dark","暗い"]];
let ti=0;try{ti=Math.max(0,THEMES.findIndex(x=>x[0]===(localStorage.getItem("momocho-theme")||"")))}catch(e){}
function applyTheme(){const k=THEMES[ti][0];if(k)document.documentElement.setAttribute("data-theme",k);else document.documentElement.removeAttribute("data-theme");$("themeBtn").title="明るさ："+THEMES[ti][1]}
$("themeBtn").onclick=()=>{ti=(ti+1)%3;try{localStorage.setItem("momocho-theme",THEMES[ti][0])}catch(e){}applyTheme();toast("明るさ："+THEMES[ti][1])};
applyTheme();
boot();
})();
</script>
